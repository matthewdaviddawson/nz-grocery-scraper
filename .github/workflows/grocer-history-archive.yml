name: PriceSmart history backup

on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC, well clear of the 14:00 UTC scrape
  workflow_dispatch:

env:
  PRICESMART_APP_URL: ${{ vars.PRICESMART_APP_URL }}
  GH_REPO: ${{ github.repository }}
  PAGE_LIMIT: "20000"

permissions:
  contents: write

concurrency:
  group: pricesmart-history-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download history export page by page
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PRICESMART_APP_URL" || { echo "Set the PRICESMART_APP_URL repository variable"; exit 1; }
          test -n "$INGEST_SECRET" || { echo "Set the INGEST_SECRET repository secret"; exit 1; }
          base="${PRICESMART_APP_URL%/}/api/admin/export/history"
          date_utc="$(date -u +%F)"
          asset="pricesmart-history-${date_utc}.ndjson.gz"

          fetch() { # fetch <output> <url> [curl args...]
            local out="$1" url="$2"; shift 2
            curl --fail --show-error --silent --location --get \
              --retry 5 --retry-delay 10 --retry-all-errors --max-time 120 \
              -H "Authorization: Bearer ${INGEST_SECRET}" \
              -H "Accept: application/x-ndjson" \
              "$@" "$url" -o "$out"
          }

          fetch manifest.json "$base/manifest"
          jq -e '.tables | length > 0' manifest.json > /dev/null || { echo "Manifest has no tables:"; head -c 300 manifest.json; exit 1; }
          echo "Manifest row counts:"; jq -r '.counts | to_entries[] | "  \(.key): \(.value)"' manifest.json

          # Rows per page: small for tables with big rows, large for the 4.7M-row price history.
          limit_for() {
            case "$1" in
              ps_grocer_history_archive) echo 50 ;;
              ps_products) echo 5000 ;;
              *) echo "$PAGE_LIMIT" ;;
            esac
          }

          : > export.ndjson
          for table in $(jq -r '.tables[]' manifest.json); do
            cursor=""; pages=0; rows=0; limit="$(limit_for "$table")"; started=$SECONDS
            while :; do
              ok=""
              for attempt in 1 2 3; do
                fetch page.ndjson "$base/page" \
                  --data-urlencode "table=$table" \
                  --data-urlencode "cursor=$cursor" \
                  --data-urlencode "limit=$limit"
                # Every complete page ends with a page_end line; anything else was cut off.
                if tail -n 1 page.ndjson | jq -e 'select(.type == "page_end")' > page_end.json 2>/dev/null; then ok=1; break; fi
                echo "  $table page $((pages + 1)) incomplete (attempt $attempt), retrying"; sleep 5
              done
              [ -n "$ok" ] || { echo "Could not download a complete page of $table"; head -c 300 page.ndjson; echo; exit 1; }

              head -n -1 page.ndjson >> export.ndjson
              pages=$((pages + 1)); rows=$((rows + $(jq -r '.rows' page_end.json)))
              cursor="$(jq -r '.nextCursor // empty' page_end.json)"
              if [ $((pages % 25)) -eq 0 ]; then echo "  $table: $rows rows so far ($((SECONDS - started))s)"; fi
              [ -n "$cursor" ] || break
            done
            expected="$(jq -r --arg t "$table" '.counts[$t] // "?"' manifest.json)"
            echo "$table: $rows rows in $pages pages, $((SECONDS - started))s (manifest said $expected)"
          done

          jq -cn --arg at "$(date -u +%FT%TZ)" --slurpfile m manifest.json \
            '{type: "export_end", exportedAt: $at, counts: $m[0].counts}' >> export.ndjson

          gzip -9 -c export.ndjson > "$asset"
          gzip -t "$asset"
          lines="$(gzip -dc "$asset" | wc -l)"
          echo "Exported $lines lines, $(du -h "$asset" | cut -f1) compressed"
          test "$lines" -gt 1

          echo "ASSET=$asset" >> "$GITHUB_ENV"
          echo "DATE_UTC=$date_utc" >> "$GITHUB_ENV"

      - name: Create or replace dated GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pricesmart-history-${DATE_UTC}"

          # Re-running on the same day replaces that day's backup.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$tag" "$ASSET" \
            --title "PriceSmart history ${DATE_UTC}" \
            --notes "Weekly off-site PriceSmart price-history backup."

      - name: Keep only the latest 12 PriceSmart history releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("pricesmart-history-"))]
                  | sort_by(.createdAt) | reverse | .[12:] | .[].tagName' |
          while read -r old_tag; do
            [ -z "$old_tag" ] || gh release delete "$old_tag" --yes --cleanup-tag
          done
