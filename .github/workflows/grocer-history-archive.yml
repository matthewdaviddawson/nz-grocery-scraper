name: Grocer history archive

# Drives PriceSmart's Grocer history archive in short batches. Each request archives
# one batch and returns within about 2 minutes, so it never depends on the app server
# keeping a long background job alive.

on:
  schedule:
    - cron: "23 */2 * * *" # every 2 hours; finishes in about a minute once nothing is due
  workflow_dispatch:

env:
  PRICESMART_APP_URL: ${{ vars.PRICESMART_APP_URL }}
  BATCH_LIMIT: "60"
  BATCH_SECONDS: "90"
  RUN_MINUTES: "100"

concurrency:
  group: grocer-history-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Archive batches until nothing is due
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          set -uo pipefail
          test -n "$PRICESMART_APP_URL" || { echo "Set the PRICESMART_APP_URL repository variable"; exit 1; }
          test -n "$INGEST_SECRET" || { echo "Set the INGEST_SECRET repository secret"; exit 1; }
          url="${PRICESMART_APP_URL%/}/api/admin/archive/batch"
          deadline=$((SECONDS + RUN_MINUTES * 60))
          batches=0; total=0; errors=0; busy_since=""

          while [ $SECONDS -lt $deadline ]; do
            status="$(curl --silent --show-error --max-time $((BATCH_SECONDS + 60)) \
              -o batch.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${INGEST_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"limit\": ${BATCH_LIMIT}, \"maxSeconds\": ${BATCH_SECONDS}}" \
              "$url")" || status="000"

            if [ "$status" = "409" ]; then
              busy_since="${busy_since:-$SECONDS}"
              echo "Another archive pass is running; waiting 60 s ($(head -c 300 batch.json 2>/dev/null))"
              # A batch never holds the lock for more than ~3 minutes; 35 minutes of busy means a stuck lock.
              if [ $((SECONDS - busy_since)) -ge 2100 ]; then
                echo "::error::Archive lock has been busy for 35+ minutes; it looks stuck (see the lock details above)"
                exit 1
              fi
              sleep 60; continue
            fi
            busy_since=""
            if [ "$status" != "200" ] || ! jq -e '.attempted != null' batch.json > /dev/null 2>&1; then
              errors=$((errors + 1))
              echo "Batch request failed (HTTP $status, error $errors of 5): $(head -c 200 batch.json 2>/dev/null)"
              [ $errors -lt 5 ] || { echo "Too many consecutive errors"; exit 1; }
              sleep $((errors * 30)); continue
            fi
            errors=0; batches=$((batches + 1))
            archived="$(jq -r '.archived' batch.json)"; total=$((total + archived))
            jq -r '"batch '"$batches"': attempted \(.attempted), archived \(.archived), failed \(.failed), " +
                   "\(.durationMs / 1000 | floor)s, not yet archived \(.notYetArchived), still due \(.remaining)"' batch.json

            if [ "$(jq -r '.remaining' batch.json)" = "0" ]; then echo "Nothing left to archive right now"; break; fi
            if [ "$(jq -r '.attempted' batch.json)" = "0" ]; then echo "Nothing attempted; stopping until next run"; break; fi
          done

          echo "Done: $total archived in $batches batches over $((SECONDS / 60)) min"
